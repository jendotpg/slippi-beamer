[package]
name = "beamer"
version = "0.1.0"
edition = "2021"
resolver = "2"
description = "A Beamer station: firmware for the LilyGO T-Dongle-S3, and the logic it runs."

[lib]
name = "beamer"

[[bin]]
name = "beamer"
harness = false
test = false

[dependencies]
esp-idf-svc = { version = "0.52", features = ["binstart"] }
anyhow = "1"
log = "0.4"
heapless = { version = "0.9", default-features = false }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

# USB descriptors and the tinyusb mass storage callbacks - the only FFI
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/beamer_msc"]
bindings_header = "components/beamer_msc/include/beamer_msc.h"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
