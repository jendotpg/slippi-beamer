# The build host, as a file.
#
#   limactl create --name=piforge-golden --mount-only "$REPO:w" piforge.yaml
#
minimumLimaVersion: 2.0.0

images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260705/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: "sha256:7df0201546f75b8bcc1044594c806c35749421ad3c9bc1be2a3ab806cfae39cc"
    variant: "server"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260705/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
    digest: "sha256:ffe6203da54deeb6db5d2a98a83f9ec8e55f149d3f7ba622e1abe5fa966ee3d6"
    variant: "server"

vmType: "vz"

cpus: 4
memory: "8GiB"
disk: "60GiB"

mounts: []

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      # Keep in step with the dependency block of ../linux-build.sh: that list
      # and this one describe the same build host, one for a real Linux box and
      # one for lima, and a build that needs a new tool needs it in both.
      apt-get update
      apt-get install -y --no-install-recommends \
          e2fsprogs dosfstools fdisk mtools xz-utils curl ca-certificates \
          qemu-user-static binfmt-support binutils

  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail

      install -d -m 0755 /opt/piforge
      cat > /opt/piforge/register-qemu-arm.sh <<'SCRIPT'
      #!/bin/bash
      set -euo pipefail
      [ -e /proc/sys/fs/binfmt_misc/qemu-arm ] && exit 0
      [ -x /usr/libexec/qemu-binfmt/arm-binfmt-P ] || {
          echo "no arm binfmt interpreter; is qemu-user-static installed?" >&2
          exit 1
      }
      printf '%s\n' ':qemu-arm:M::\x7f\x45\x4c\x46\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x28\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/libexec/qemu-binfmt/arm-binfmt-P:OPF' \
          > /proc/sys/fs/binfmt_misc/register
      [ -e /proc/sys/fs/binfmt_misc/qemu-arm ] || {
          echo "qemu-arm registration did not take" >&2
          exit 1
      }
      SCRIPT
      chmod 0755 /opt/piforge/register-qemu-arm.sh

      cat > /etc/systemd/system/qemu-arm-binfmt.service <<'UNIT'
      [Unit]
      Description=Register qemu-arm in binfmt_misc for the armhf chroot
      Requires=proc-sys-fs-binfmt_misc.mount
      After=proc-sys-fs-binfmt_misc.mount

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/opt/piforge/register-qemu-arm.sh

      [Install]
      WantedBy=multi-user.target
      UNIT

      systemctl daemon-reload
      systemctl enable --now qemu-arm-binfmt.service

probes:
  - mode: readiness
    description: "qemu-arm registered in binfmt_misc"
    script: |
      #!/bin/bash
      set -eu
      if ! timeout 60s bash -c 'until [ -e /proc/sys/fs/binfmt_misc/qemu-arm ]; do sleep 1; done'; then
        echo >&2 "qemu-arm is not registered in binfmt_misc"
        exit 1
      fi
    hint: |
      qemu-arm never registered in binfmt_misc, so the armhf chroot in
      build-image.sh would not be able to execute anything. Check:
        limactl shell piforge -- systemctl status qemu-arm-binfmt.service
        limactl shell piforge -- ls /usr/libexec/qemu-binfmt/
