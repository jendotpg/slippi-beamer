# Raspberry Pi OS Lite 32-bit.
BASE_IMAGE_URL="https://downloads.raspberrypi.com/raspios_lite_armhf/images/raspios_lite_armhf-2026-06-19/2026-06-18-raspios-trixie-armhf-lite.img.xz"
BASE_IMAGE_SHA256="ea4e84c501d6dd4f4b1d04eb84df133a03f90a05ee2e8ab849185c17c2b0707b"

# Expected ELF machine of the rootfs, checked against the downloaded image so a
# mis-pinned URL fails with a clear message instead of "exec format error"
# somewhere deep inside the chroot.
EXPECT_ELF_ARCH="ARM"

# Static qemu binary needed to chroot this rootfs from an aarch64 build host.
# Apple Silicon cannot execute AArch32 at EL0, so this is not optional there.
QEMU_STATIC="/usr/bin/qemu-arm-static"

# Headroom added to the rootfs before baking: the 1 GB template plus packages.
GROW_MB=2048
